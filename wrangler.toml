#:schema node_modules/wrangler/config-schema.json
# Cloudflare Pages project (static SPA in ./dist + Pages Functions in ./functions)
name = "service-buttler"
pages_build_output_dir = "./dist"
compatibility_date = "2024-11-01"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "service-buttler-db"
database_id = "ad0f0f46-b51c-497c-a685-1629b14ab43d"

# R2 Object Storage binding
[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "service-buttler-assets"

